<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSV → NoSQL MongoDB</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #222;
        }

        header {
            background: #13aa52;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .contenedor {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        input[type="file"] {
            width: 100%;
            padding: 15px;
            border: 2px dashed #13aa52;
            border-radius: 8px;
            background: #f8fff9;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin: 8px 5px 8px 0;
        }

        .verde {
            background: #13aa52;
            color: white;
        }

        .azul {
            background: #1976d2;
            color: white;
        }

        .gris {
            background: #555;
            color: white;
        }

        button:hover {
            opacity: .85;
        }

        #estado {
            margin-top: 15px;
            padding: 15px;
            background: #eef7f0;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #13aa52;
            color: white;
        }

        .tabla {
            overflow-x: auto;
            max-height: 450px;
            overflow-y: auto;
        }

        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .contador {
            font-size: 18px;
            font-weight: bold;
            color: #13aa52;
        }
    </style>
</head>

<body>

<header>
    <h1>CSV → NoSQL MongoDB</h1>
    <p>Convertidor de datos de Excel/CSV a documentos JSON</p>
</header>

<div class="contenedor">

    <div class="card">

        <h2>1. Seleccionar archivo CSV</h2>

        <input
            type="file"
            id="archivo"
            accept=".csv,text/csv"
        >

        <div id="estado">
            Esperando archivo...
        </div>

    </div>


    <div class="card">

        <h2>2. Datos convertidos</h2>

        <div class="contador">
            Registros: <span id="cantidad">0</span>
        </div>

        <div class="tabla">

            <table id="tabla">

                <thead>
                    <tr id="cabecera"></tr>
                </thead>

                <tbody id="cuerpo"></tbody>

            </table>

        </div>

    </div>


    <div class="card">

        <h2>3. JSON NoSQL</h2>

        <button class="verde" onclick="descargarJSON()">
            Descargar JSON
        </button>

        <button class="azul" onclick="copiarJSON()">
            Copiar JSON
        </button>

        <textarea id="resultado" readonly></textarea>

    </div>

</div>


<script>

let documentos = [];


/*
    Detectar automáticamente el separador:
    coma, punto y coma o tabulador
*/
function detectarSeparador(linea) {

    let separadores = [",", ";", "\t"];

    let mejor = ",";
    let mayor = 0;

    separadores.forEach(separador => {

        let cantidad =
            linea.split(separador).length - 1;

        if (cantidad > mayor) {

            mayor = cantidad;
            mejor = separador;

        }

    });

    return mejor;
}


/*
    Parser CSV.
    Soporta campos entre comillas.
*/
function parseCSV(texto) {

    let primeraLinea =
        texto.split(/\r?\n/)[0];

    let separador =
        detectarSeparador(primeraLinea);

    let filas = [];

    let fila = [];
    let campo = "";
    let comillas = false;

    for (let i = 0; i < texto.length; i++) {

        let caracter = texto[i];

        if (caracter === '"') {

            if (
                comillas &&
                texto[i + 1] === '"'
            ) {

                campo += '"';
                i++;

            } else {

                comillas = !comillas;

            }

        }

        else if (
            caracter === separador &&
            !comillas
        ) {

            fila.push(campo);
            campo = "";

        }

        else if (
            (caracter === "\n" ||
             caracter === "\r") &&
            !comillas
        ) {

            if (caracter === "\r" &&
                texto[i + 1] === "\n") {

                i++;

            }

            fila.push(campo);

            if (fila.some(x => x.trim() !== "")) {

                filas.push(fila);

            }

            fila = [];
            campo = "";

        }

        else {

            campo += caracter;

        }

    }

    if (campo !== "" || fila.length > 0) {

        fila.push(campo);

        filas.push(fila);

    }

    return filas;

}


/*
    Limpiar nombres de columnas
*/
function limpiarNombre(nombre) {

    return nombre
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[º°]/g, "")
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");

}


/*
    Convertir valores numéricos
*/
function convertirNumero(valor) {

    valor = valor.trim();

    if (valor === "") {
        return null;
    }

    /*
       Ejemplo:

       2256,78
       ↓
       2256.78
    */

    if (/^-?\d+,\d+$/.test(valor)) {

        return Number(
            valor.replace(",", ".")
        );

    }

    /*
       Números con separador de miles
    */

    if (
        /^\d{1,3}(\.\d{3})+,\d+$/.test(valor)
    ) {

        return Number(
            valor
                .replace(/\./g, "")
                .replace(",", ".")
        );

    }

    /*
       Enteros
    */

    if (/^-?\d+$/.test(valor)) {

        return Number(valor);

    }

    /*
       Decimales con punto
    */

    if (/^-?\d+\.\d+$/.test(valor)) {

        return Number(valor);

    }

    return valor;

}


/*
    Determinar tipo de campo
*/
function convertirCampo(nombre, valor) {

    let limpio = valor.trim();

    /*
       Fecha

       12/03/2026
       →
       2026-03-12
    */

    if (
        nombre.includes("fecha") &&
        /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(limpio)
    ) {

        let partes = limpio.split("/");

        return `${partes[2]}-${partes[1].padStart(2,"0")}-${partes[0].padStart(2,"0")}`;

    }


    /*
       Campos que deben ser números
    */

    if (
        nombre.includes("anio") ||
        nombre.includes("ano") ||
        nombre.includes("mes") ||
        nombre.includes("cantidad") ||
        nombre.includes("impuesto") ||
        nombre.includes("interes") ||
        nombre.includes("total")
    ) {

        return convertirNumero(limpio);

    }


    /*
       Nº contribuyente como STRING
       para no perder dígitos.
    */

    if (
        nombre.includes("contribuyente")
    ) {

        return limpio;

    }


    return limpio;

}


/*
    Mostrar tabla
*/
function mostrarTabla(documentos) {

    let cabecera =
        document.getElementById("cabecera");

    let cuerpo =
        document.getElementById("cuerpo");

    cabecera.innerHTML = "";
    cuerpo.innerHTML = "";

    if (documentos.length === 0) {
        return;
    }

    let columnas =
        Object.keys(documentos[0]);

    columnas.forEach(columna => {

        let th =
            document.createElement("th");

        th.textContent = columna;

        cabecera.appendChild(th);

    });


    /*
       Mostrar máximo 100 registros
       para que el navegador no se ralentice
    */

    let limite =
        Math.min(documentos.length, 100);

    for (let i = 0; i < limite; i++) {

        let tr =
            document.createElement("tr");

        columnas.forEach(columna => {

            let td =
                document.createElement("td");

            td.textContent =
                documentos[i][columna];

            tr.appendChild(td);

        });

        cuerpo.appendChild(tr);

    }

}


/*
    Procesar archivo
*/
document
.getElementById("archivo")
.addEventListener("change", function(event) {

    let archivo = event.target.files[0];

    if (!archivo) {
        return;
    }

    document.getElementById("estado")
        .textContent =
        "Procesando archivo...";

    let lector =
        new FileReader();

    lector.onload = function(e) {

        let texto = e.target.result;

        let filas =
            parseCSV(texto);

        if (filas.length < 2) {

            alert(
                "El CSV no contiene suficientes datos."
            );

            return;

        }

        let encabezadosOriginales =
            filas[0];

        let encabezados =
            encabezadosOriginales.map(
                limpiarNombre
            );


        documentos = [];


        /*
           Convertir cada fila
        */

        for (
            let i = 1;
            i < filas.length;
            i++
        ) {

            let fila = filas[i];

            let documento = {};

            for (
                let j = 0;
                j < encabezados.length;
                j++
            ) {

                let nombre =
                    encabezados[j];

                let valor =
                    fila[j] ?? "";

                documento[nombre] =
                    convertirCampo(
                        nombre,
                        valor
                    );

            }

            documentos.push(documento);

        }


        /*
           Mostrar cantidad
        */

        document.getElementById("cantidad")
            .textContent =
            documentos.length.toLocaleString();


        /*
           Mostrar tabla
        */

        mostrarTabla(documentos);


        /*
           Mostrar JSON
        */

        document.getElementById("resultado")
            .value =
            JSON.stringify(
                documentos,
                null,
                2
            );


        document.getElementById("estado")
            .textContent =
            "✓ Archivo convertido correctamente.";

    };


    /*
       UTF-8
    */

    lector.readAsText(archivo, "UTF-8");

});


/*
    Descargar JSON
*/
function descargarJSON() {

    if (documentos.length === 0) {

        alert(
            "Primero selecciona un archivo CSV."
        );

        return;

    }

    let contenido =
        JSON.stringify(
            documentos,
            null,
            2
        );

    let blob =
        new Blob(
            [contenido],
            {
                type: "application/json"
            }
        );

    let url =
        URL.createObjectURL(blob);

    let enlace =
        document.createElement("a");

    enlace.href = url;

    enlace.download =
        "pagos_inmuebles_nosql.json";

    enlace.click();

    URL.revokeObjectURL(url);

}


/*
    Copiar JSON
*/
async function copiarJSON() {

    if (documentos.length === 0) {

        alert(
            "Primero selecciona un archivo CSV."
        );

        return;

    }

    await navigator.clipboard.writeText(
        JSON.stringify(
            documentos,
            null,
            2
        )
    );

    alert(
        "JSON copiado correctamente."
    );

}

</script>

</body>
</html>
